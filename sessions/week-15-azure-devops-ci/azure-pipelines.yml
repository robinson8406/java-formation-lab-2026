# TODO 1: Define cuándo se activa el pipeline.
#   - trigger: ramas 'main' y 'week-15*'
#   - pr: solo hacia 'week-15-start'
trigger:
  branches:
    include:
      - main
      - 'week-15*'

pr:
  branches:
    include:
      - 'week-15-start'   # solo PRs hacia esta rama
  paths:
    include:
      - 'sessions/week-15-azure-devops-ci/*'   # solo cambios de esta semana

# TODO 2: Elige el agente de ejecución.
pool:
  vmImage: ''  # ubuntu-latest | windows-latest | macOS-latest

# TODO 3: Define variables útiles (opcional pero recomendado).
variables:
  # Ejemplo: MAVEN_OPTS: '-Xmx1024m'
  # TODO: agrega las variables que consideres necesarias

stages:
  - stage: CI
    displayName: 'Integración Continua'
    jobs:
      - job: Build
        displayName: 'Build & Test'
        steps:

          # TODO 4: Agrega el paso de compilación y tests.
          # Usa Maven@4 con:
          #   - goal: verify
          #   - Java 21
          #   - Resultados JUnit publicados
          #   - Cobertura JaCoCo con umbral mínimo del 80 %
          - task: Maven@4
            displayName: 'mvn verify'
            inputs:
              mavenPomFile: 'sessions/week-15-azure-devops-ci/pom.xml'
              goals: ''                           # TODO: ¿qué goal necesitas?
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: ''                # TODO: versión de Java
              publishJUnitResults:                # TODO: true o false
              testResultsFiles: ''                # TODO: patrón de resultados JUnit
              codeCoverageToolOption: ''          # TODO: herramienta de cobertura
              codeCoverageFailIfCoverageEmpty: true

