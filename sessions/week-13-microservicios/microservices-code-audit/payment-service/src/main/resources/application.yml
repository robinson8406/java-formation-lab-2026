server:
  port: 8082
spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console
logging:
  config: classpath:log4j2-spring.xml

clients:
  provider:
    base-url: http://localhost:8083
    connect-timeout: 200ms
    read-timeout: 800ms

resilience4j:
  retry:
    instances:
      providerService:
        max-attempts: 3
        wait-duration: 100ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - com.acme.audit.payment.infrastructure.client.ProviderCommunicationException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
          - org.springframework.web.client.HttpServerErrorException
