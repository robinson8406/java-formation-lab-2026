server:
  port: 8081
spring:
  application:
    name: order-service
  datasource:
    url: jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

clients:
  payment:
    base-url: http://localhost:8082
    connect-timeout: 200ms
    read-timeout: 600ms
logging:
  config: classpath:log4j2-spring.xml
