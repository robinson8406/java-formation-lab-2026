spring.application.name=retail-onboarding-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/retaildb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:retail}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

management.endpoints.web.exposure.include=health
