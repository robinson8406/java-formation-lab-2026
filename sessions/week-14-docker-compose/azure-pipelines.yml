# ─────────────────────────────────────────────────────────────────────────────
# Pipeline pre-configurado — semanas 01-14
# ─────────────────────────────────────────────────────────────────────────────
# NO necesitas modificar este archivo.
# Tu único objetivo: hacer que los tests pasen en verde.
#
# ¿Qué hace este pipeline?
#   1. Se activa cuando abres un PR hacia week-XX-start
#   2. Ejecuta: mvn verify  (compila + tests + cobertura con JaCoCo)
#   3. Reporta ✅ o ❌ directamente en tu PR de GitHub
#   4. Sin verde → no puedes mergear
#
# Este archivo debe copiarse a la raíz de la rama week-XX-start.
# ─────────────────────────────────────────────────────────────────────────────

trigger: none   # no se activa al hacer push directo

pr:
  branches:
    include:
      - 'week-14-start'   # solo PRs hacia esta rama
  paths:
    include:
      - 'sessions/week-14-docker-compose/*'   # solo cambios de esta semana

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: Maven@4
    displayName: 'Build & Test — week-14-docker-compose'
    inputs:
      mavenPomFile: 'sessions/week-14-docker-compose/pom.xml'
      goals: 'verify'
      javaHomeOption: 'JDKVersion'
      jdkVersionOption: '21'
      publishJUnitResults: true
      testResultsFiles: '**/surefire-reports/TEST-*.xml'
      codeCoverageToolOption: 'JaCoCo'
      codeCoverageClassFilesDirectories: 'target/classes'
