# Validacion de CreateOrderRequest (el handler antepone el nombre del campo: "campo: mensaje")
order.customer-id.required=es obligatorio y no puede estar vacio
order.items.required=debe contener al menos un elemento
order.item.sku.required=es obligatorio
order.item.quantity.positive=debe ser mayor a 0
order.item.unit-price.positive=debe ser mayor a 0
order.delivery-address.required=es obligatorio
order.delivery-address.min-size=debe tener al menos 10 caracteres
order.id.max-size=no puede superar 36 caracteres

# Mensajes de error de la API
error.order-not-found=Pedido no encontrado: {0}
error.malformed-request=El cuerpo de la peticion no es un JSON valido
error.internal=Error interno del servidor
